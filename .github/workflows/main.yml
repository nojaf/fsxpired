name: Build main

on: [push, pull_request]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      # One platform failing should not hide whether the other two are fine, which is most of
      # the reason to run three of them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Build
      run: dotnet fsi build.fsx
    - name: Upload documentation
      if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./output

  # Serving the site is its own job because GitHub deploys Pages from an artifact rather than from
  # a branch. Only this job needs the Pages permissions, so the build keeps the read-only default.
  deploy-docs:
    name: Publish documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # upload-sarif writes a code scanning report, which the default read-only token cannot do.
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Run analyzers
        run: dotnet fsi build.fsx -- -p Analyze
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: analysis.sarif
